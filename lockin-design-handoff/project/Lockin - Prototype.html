<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lockin — Champ Select Co-Pilot</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #050607;
    font-family: var(--font-ui);
    color: var(--fg-1);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  ::selection { background: var(--accent-bg); }
  /* scrollbars — quiet */
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--ink-700); border-radius: 999px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-600); background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* Brand accent = crimson (hsla 345 100% 48%) ; UI font = Poppins. */
  :root {
    --font-ui: "Poppins", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --accent: #f5003d;
    --accent-strong: #ff2e5f;
    --accent-press: #cc0034;
    --accent-fg: #ffffff;
    --accent-bg: rgba(245,0,61,0.12);
    --accent-glow: rgba(245,0,61,0.32);
  }

  /* ----------------------------- animations ----------------------------- */
  @keyframes acBlink { 0%,45% { opacity: 1; } 50%,95% { opacity: 0; } 100% { opacity: 1; } }
  .ac-blink { animation: acBlink 1.06s steps(1) infinite; }

  @keyframes ccpBreathe { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.55; transform: scale(0.96); } }
  .ccp-breathe { animation: ccpBreathe 2.6s var(--ease-soft) infinite; }

  @keyframes ccpPing { 0% { transform: scale(1); opacity: 0.6; } 70%,100% { transform: scale(2.6); opacity: 0; } }
  .ccp-ping { animation: ccpPing 2.4s var(--ease-soft) infinite; }

  @keyframes ccpHalo { 0% { transform: scale(0.7); opacity: 0.5; } 100% { transform: scale(1.5); opacity: 0; } }
  .ccp-halo { animation: ccpHalo 3.2s var(--ease-soft) infinite; }
  .ccp-halo-2 { animation-delay: 1.6s; }

  @keyframes ccpFade { from { opacity: 0; } to { opacity: 1; } }
  .ccp-fade { animation: ccpFade var(--dur-base) var(--ease-standard); }

  @keyframes ccpDrawer { from { transform: translateX(26px); } to { transform: none; } }
  .ccp-drawer { animation: ccpDrawer var(--dur-slow) var(--ease-emphasized); }

  @keyframes ccpScreenIn { from { transform: translateY(7px); } to { transform: none; } }
  .ccp-screen { animation: ccpScreenIn var(--dur-slow) var(--ease-emphasized); }

  @keyframes ccpRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .ac-blink, .ccp-breathe, .ccp-ping, .ccp-halo, .ccp-screen, .ccp-drawer, .ccp-fade { animation: none; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="champ-art.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="champ-select-parts.jsx"></script>
<script type="text/babel" src="champ-select.jsx"></script>
<script type="text/babel" src="live-view.jsx"></script>
<script type="text/babel" src="notes.jsx"></script>
<script type="text/babel" src="settings.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
