appId: com.feliperodriguess.lockin
productName: lockin
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - '!resources/ss/**'
asarUnpack:
  - resources/**
win:
  executableName: lockin
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
