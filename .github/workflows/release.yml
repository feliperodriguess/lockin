name: Release

# Builds and publishes a GitHub Release whenever the version in package.json
# changes on main: macOS dmgs (arm64 + x64) and a Windows NSIS installer,
# tagged v{version}. Pushes that don't bump the version are no-ops.

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  version:
    name: Detect new version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.tag.outputs.released }}
    steps:
      - uses: actions/checkout@v4
      - name: Read package.json version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Check whether v${{ steps.version.outputs.version }} is already released
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" > /dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: version
    if: needs.version.outputs.released == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    env:
      # Builds are unsigned: skip certificate discovery on macOS
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Build app (typecheck + electron-vite)
        run: pnpm build
      - name: Package ${{ matrix.target }}
        run: pnpm exec electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*-setup.exe
          if-no-files-found: error

  release:
    name: Publish v${{ needs.version.outputs.version }}
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: lockin v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/*
